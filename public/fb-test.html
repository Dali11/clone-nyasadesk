<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>FB Embedded Signup Debug</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 24px; }
    button { font-size: 16px; padding: 12px 24px; margin-bottom: 16px; cursor: pointer; }
    pre { background: #000; padding: 16px; border: 1px solid #333; white-space: pre-wrap; word-break: break-all; min-height: 100px; }
    .err { color: #f66; }
  </style>
</head>
<body>
  <h2>FB Embedded Signup Debug Page</h2>
  <p>Domain: <span id="domain"></span></p>
  <p>SDK status: <span id="sdk-status">loading...</span></p>
  <button id="btn" disabled>Test FB.login (Embedded Signup)</button>
  <pre id="output">(waiting)</pre>

  <script>
    document.getElementById('domain').textContent = window.location.origin;
    const out = document.getElementById('output');
    const log = (msg) => { out.textContent += '\n' + msg; };

    window.addEventListener('error', function(e) {
      log('[window.onerror] ' + e.message + ' at ' + e.filename + ':' + e.lineno);
    });

    window.fbAsyncInit = function() {
      document.getElementById('sdk-status').textContent = 'FB object ready, initializing...';
      try {
        FB.init({
          appId: '1018351794383193',
          cookie: true,
          xfbml: true,
          version: 'v19.0'
        });
        document.getElementById('sdk-status').textContent = 'FB.init() called successfully';
        document.getElementById('btn').disabled = false;
      } catch (e) {
        document.getElementById('sdk-status').textContent = 'FB.init() THREW ERROR';
        log('[FB.init error] ' + e.message);
      }
    };

    document.getElementById('btn').addEventListener('click', function() {
      out.textContent = '(calling FB.login...)';
      try {
        FB.login(function(response) {
          out.textContent = 'FB.login callback fired:\n' + JSON.stringify(response, null, 2);
        }, {
          config_id: '2792026701196149',
          response_type: 'code',
          override_default_response_type: true,
          extras: {
            setup: {},
            featureType: '',
            sessionInfoVersion: '3'
          }
        });
        log('FB.login() called without throwing — waiting for popup/callback...');
      } catch (e) {
        log('[FB.login threw] ' + e.message);
      }
    });

    // Load SDK
    (function(d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) return;
      js = d.createElement(s); js.id = id;
      js.src = 'https://connect.facebook.net/en_US/sdk.js';
      js.onerror = function() {
        document.getElementById('sdk-status').textContent = 'FAILED TO LOAD SDK SCRIPT';
      };
      fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'facebook-jssdk'));

    setTimeout(function() {
      if (!window.FB) {
        document.getElementById('sdk-status').textContent = 'FB SDK never loaded (10s timeout) — check network/adblock/CSP';
      }
    }, 10000);
  </script>
</body>
</html>
