<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connecting WhatsApp · Nyasadesk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0B141A;
      color: #e9edef;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #202C33;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 56px; height: 56px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #075E54, #128C7E);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: white;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    p  { font-size: 14px; color: #8696a0; line-height: 1.5; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #2a3942;
      border-top-color: #25D366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #ff6b6b; }
    .hidden { display: none; }
    .btn {
      display: block;
      margin-top: 20px;
      padding: 14px 32px;
      background: #25D366;
      color: #0B141A;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      border: none;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    .btn.secondary {
      background: #2a3942;
      color: #e9edef;
      margin-top: 12px;
    }
    .pwa-notice {
      margin-top: 20px;
      padding: 16px;
      background: #2a3942;
      border-radius: 10px;
      text-align: left;
    }
    .pwa-notice p { color: #e9edef; font-size: 13px; margin-bottom: 8px; }
    .pwa-notice p:last-child { margin-bottom: 0; }
    .pwa-notice strong { color: #25D366; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">N</div>
    <h1 id="title">Connect WhatsApp Business</h1>
    <p id="status">Preparing Facebook's secure signup flow…</p>
    <div id="spinner" class="spinner"></div>
    <div id="actions" class="hidden"></div>
  </div>

  <script>
    // ──────────────────────────────────────────────────────────────────────
    // WhatsApp Embedded Signup — intermediate page
    //
    // Embedded Signup REQUIRES Facebook's FB.login() JS SDK with config_id
    // and extras (featureType, sessionInfoVersion, etc.). These extras are
    // what trigger the WhatsApp-specific signup UI (WBA selection, number
    // picker). Without the SDK, a plain OAuth redirect shows generic login.
    //
    // In a PWA, popups may be blocked. We try FB.login() first, and if the
    // popup fails, we fall back to opening the same page in the system
    // browser where popups work normally.
    // ──────────────────────────────────────────────────────────────────────

    var PROD_URL = 'https://nyasadesk1.vercel.app';
    var workspaceId = new URLSearchParams(window.location.search).get('workspace_id');
    var statusEl  = document.getElementById('status');
    var titleEl   = document.getElementById('title');
    var spinnerEl = document.getElementById('spinner');
    var actionsEl = document.getElementById('actions');

    function isStandalonePWA() {
      return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true
        || document.referrer.startsWith('android-app://');
    }

    function redirectToSettings(extra) {
      window.location.href = '/settings?tab=channels' + (extra || '');
    }

    function sendCodeToBackend(code) {
      titleEl.textContent = 'Completing connection';
      statusEl.textContent = 'Registering your WhatsApp number with WasapFlow…';
      spinnerEl.classList.remove('hidden');
      actionsEl.classList.add('hidden');

      fetch('/api/auth/whatsapp-embedded', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          code: code,
          workspace_id: workspaceId,
          provider: 'wasapflow'
        })
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.ok) {
          titleEl.textContent = 'WhatsApp connected!';
          statusEl.textContent = 'Redirecting to Settings…';
          setTimeout(function() { redirectToSettings('&wa=connected'); }, 1500);
        } else {
          redirectToSettings('&wa_error=' + encodeURIComponent(d.error || 'Registration failed'));
        }
      })
      .catch(function(e) {
        redirectToSettings('&wa_error=' + encodeURIComponent(e.message));
      });
    }

    // Check if returning from FB.login redirect mode (code in URL hash or query)
    var urlParams = new URLSearchParams(window.location.search);
    var urlHash   = new URLSearchParams(window.location.hash.substring(1));

    if (urlHash.get('code')) {
      sendCodeToBackend(urlHash.get('code'));
    } else if (urlParams.get('code') && urlParams.get('state')) {
      sendCodeToBackend(urlParams.get('code'));
    } else if (!workspaceId) {
      titleEl.textContent = 'Error';
      titleEl.classList.add('error');
      statusEl.textContent = 'Missing workspace ID. Go back to Settings and try again.';
      spinnerEl.classList.add('hidden');
      actionsEl.innerHTML = '<a class="btn" href="/settings?tab=channels">Back to Settings</a>';
      actionsEl.classList.remove('hidden');
    } else {
      // ── First load: fetch config and launch FB SDK ──────────────────
      fetch('/api/channels?action=signup-config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}'
      })
      .then(function(r) { return r.json(); })
      .then(function(cfg) {
        if (!cfg.ok || !cfg.app_id || !cfg.config_id) {
          throw new Error(cfg.error || 'Could not load WhatsApp signup config');
        }

        var extras = cfg.extras || {
          setup: {},
          featureType: 'whatsapp_business_app_onboarding',
          sessionInfoVersion: '3',
          version: 'v4'
        };

        // ── Session info listener (captures waba_id, phone_number_id) ──
        // The FB SDK posts these events from the popup to the opener.
        window.addEventListener('message', function(event) {
          if (!event.origin || !event.origin.endsWith('facebook.com')) return;
          try {
            var data = JSON.parse(event.data);
            if (data.type === 'WA_EMBEDDED_SIGNUP') {
              if (data.event === 'FINISH') {
                // The code will also come through the FB.login callback,
                // but we can show progress here.
                titleEl.textContent = 'Signup complete!';
                statusEl.textContent = 'Registering with WasapFlow…';
              } else if (data.event === 'ERROR') {
                statusEl.textContent = 'Error: ' + (data.data?.error_message || 'Unknown error');
              }
            }
          } catch(e) {}
        });

        // ── Set up FB SDK ──────────────────────────────────────────────
        window.fbAsyncInit = function() {
          FB.init({
            appId:   cfg.app_id,
            cookie:  true,
            xfbml:   true,
            version: 'v19.0'
          });

          titleEl.textContent = 'Opening Facebook…';
          statusEl.textContent = 'A popup will open for you to select your WhatsApp number.';

          // Auto-launch FB.login after a short delay
          setTimeout(function() {
            FB.login(function(response) {
              if (response.status === 'connected' && response.authResponse) {
                var code = response.authResponse.code;
                if (code) {
                  sendCodeToBackend(code);
                } else {
                  // No code but connected — might have waba_id/phone from sessionInfo
                  redirectToSettings('&wa_error=' + encodeURIComponent('No authorization code returned. Please try again.'));
                }
              } else {
                // Login cancelled or failed
                var isPWA = isStandalonePWA();
                titleEl.textContent = 'Popup blocked?';
                statusEl.textContent = isPWA
                  ? 'Your app (PWA) may have blocked the Facebook popup.'
                  : 'The Facebook popup was closed before completing signup.';

                spinnerEl.classList.add('hidden');
                actionsEl.innerHTML = '';

                if (isPWA) {
                  // PWA fallback: show a link to open in the system browser
                  var notice = document.createElement('div');
                  notice.className = 'pwa-notice';
                  notice.innerHTML = '<p><strong>Open in your phone\'s browser</strong></p>'
                    + '<p>Popups don\'t work inside installed apps. Tap the button below to open this page in your regular browser (Safari/Chrome) where the Facebook popup can work.</p>';
                  actionsEl.appendChild(notice);

                  var openInBrowser = document.createElement('a');
                  openInBrowser.className = 'btn';
                  openInBrowser.href = window.location.href;
                  openInBrowser.target = '_blank';
                  openInBrowser.rel = 'noopener';
                  openInBrowser.textContent = 'Open in Browser';
                  actionsEl.appendChild(openInBrowser);
                } else {
                  // Not PWA — just show retry
                  var retry = document.createElement('button');
                  retry.className = 'btn';
                  retry.textContent = 'Try Again';
                  retry.onclick = function() { window.location.reload(); };
                  actionsEl.appendChild(retry);
                }

                var back = document.createElement('a');
                back.className = 'btn secondary';
                back.href = '/settings?tab=channels';
                back.textContent = 'Back to Settings';
                actionsEl.appendChild(back);

                actionsEl.classList.remove('hidden');
              }
            }, {
              config_id:                      cfg.config_id,
              response_type:                  'code',
              override_default_response_type: true,
              extras:                         extras
            });
          }, 600);
        };

        // Load FB SDK
        var script = document.createElement('script');
        script.src = 'https://connect.facebook.net/en_US/sdk.js';
        script.async = true;
        script.defer = true;
        document.head.appendChild(script);

        // Timeout: if SDK doesn't load in 12s
        setTimeout(function() {
          if (!window.FB) {
            titleEl.textContent = 'Facebook SDK failed to load';
            titleEl.classList.add('error');
            statusEl.textContent = 'Check your internet connection and try again.';
            spinnerEl.classList.add('hidden');
            actionsEl.innerHTML = '<a class="btn" href="/settings?tab=channels">Back to Settings</a>';
            actionsEl.classList.remove('hidden');
          }
        }, 12000);
      })
      .catch(function(e) {
        titleEl.textContent = 'Connection failed';
        titleEl.classList.add('error');
        statusEl.textContent = e.message || 'Failed to initialize WhatsApp connection';
        spinnerEl.classList.add('hidden');
        actionsEl.innerHTML = '<a class="btn" href="/settings?tab=channels">Back to Settings</a>';
        actionsEl.classList.remove('hidden');
      });
    }
  </script>
</body>
</html>
