<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connecting WhatsApp · Nyasadesk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0B141A;
      color: #e9edef;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 16px;
    }
    .card { background: #202C33; border-radius: 16px; padding: 40px 32px; max-width: 380px; width: 100%; text-align: center; }
    .logo { width: 56px; height: 56px; margin: 0 auto 20px; background: linear-gradient(135deg, #075E54, #128C7E); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; color: white; }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    p  { font-size: 14px; color: #8696a0; line-height: 1.5; }
    .spinner { width: 28px; height: 28px; border: 3px solid #2a3942; border-top-color: #25D366; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 20px auto 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn { display: block; margin-top: 20px; padding: 14px 32px; background: #25D366; color: #0B141A; text-decoration: none; border-radius: 10px; font-weight: 700; font-size: 15px; border: none; cursor: pointer; width: 100%; text-align: center; }
    .btn.secondary { background: #2a3942; color: #e9edef; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">N</div>
    <h1>Connecting WhatsApp…</h1>
    <p>Taking you to the secure WhatsApp signup page.</p>
    <div class="spinner"></div>
    <noscript>
      <p style="color:#ff6b6b;margin-top:12px">JavaScript is required. Please enable it and try again.</p>
      <a class="btn" href="/settings?tab=channels">Back to Settings</a>
    </noscript>
  </div>

  <script>
    // ──────────────────────────────────────────────────────────────────────
    // FULL PAGE REDIRECT to WasapFlow's hosted connect page.
    //
    // Previous approaches (popup, new tab) failed because the hosted page
    // runs window.resizeTo(1,1) which can succeed on popup-opened windows
    // (even tabs opened via window.open on some mobile browsers), making
    // the window 1x1 invisible → browser blocks FB.login's popup → instant
    // "Authorization cancelled".
    //
    // A full page redirect makes the hosted page the MAIN page. Browsers
    // don't allow window.resizeTo on main pages → the resize fails silently
    // → the page stays full-size → FB.login's popup opens normally.
    //
    // Downside: no window.opener for postMessage. After completing the
    // signup, the user navigates back to Settings and clicks "Check
    // Connection" to sync the WABA from WasapFlow's API.
    // ──────────────────────────────────────────────────────────────────────

    var workspaceId = new URLSearchParams(window.location.search).get('workspace_id');

    if (!workspaceId) {
      document.querySelector('h1').textContent = 'Error';
      document.querySelector('p').textContent = 'Missing workspace ID. Go back to Settings and try again.';
      document.querySelector('.spinner').style.display = 'none';
      document.body.innerHTML += '<div style="text-align:center;margin-top:20px"><a class="btn" href="/settings?tab=channels" style="display:inline-block;padding:14px 32px;background:#25D366;color:#0B141A;text-decoration:none;border-radius:10px;font-weight:700">Back to Settings</a></div>';
    } else {
      // Full redirect to the backend endpoint which redirects to WasapFlow
      window.location.href = '/api/channels?action=hosted-connect&workspace_id=' + workspaceId;
    }
  </script>
</body>
</html>
