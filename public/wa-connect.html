<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connecting WhatsApp · Nyasadesk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0B141A;
      color: #e9edef;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #202C33;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 380px;
      width: calc(100% - 32px);
      text-align: center;
    }
    .logo {
      width: 56px; height: 56px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #075E54, #128C7E);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: white;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    p  { font-size: 14px; color: #8696a0; line-height: 1.5; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #2a3942;
      border-top-color: #25D366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #ff6b6b; }
    .hidden { display: none; }
    a.btn, button.btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 32px;
      background: #25D366;
      color: #0B141A;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      border: none;
      cursor: pointer;
      width: 100%;
    }
    a.btn.secondary, button.btn.secondary {
      background: #2a3942;
      color: #e9edef;
      margin-top: 12px;
    }
    .step {
      text-align: left;
      margin: 20px 0;
      padding: 16px;
      background: #2a3942;
      border-radius: 10px;
    }
    .step p { color: #e9edef; font-size: 13px; }
    .step-num {
      display: inline-block;
      width: 22px; height: 22px;
      background: #25D366;
      color: #0B141A;
      border-radius: 50%;
      text-align: center;
      line-height: 22px;
      font-size: 12px;
      font-weight: 700;
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">N</div>
    <h1 id="title">Connect WhatsApp Business</h1>
    <p id="status">Preparing Facebook's secure signup flow…</p>
    <div id="spinner" class="spinner"></div>
    <div id="manual" class="hidden">
      <div class="step">
        <p><span class="step-num">1</span>Tap the green button below to open Facebook</p>
      </div>
      <div class="step">
        <p><span class="step-num">2</span>Log in, select your Business, and pick your WhatsApp number</p>
      </div>
      <div class="step">
        <p><span class="step-num">3</span>Verify your number with the SMS code Meta sends you</p>
      </div>
      <button class="btn" id="openFb">Open Facebook Signup</button>
      <button class="btn secondary" id="backBtn">Back to Settings</button>
    </div>
  </div>

  <script>
    // ──────────────────────────────────────────────────────────────────────
    // WhatsApp Embedded Signup — intermediate page
    //
    // The Embedded Signup UI (WBA selection + number picker) only renders
    // when Facebook's OAuth dialog is opened in a POPUP/new tab context with
    // config_id. A full-page redirect with config_id shows a generic login
    // dialog instead. FB.login() JS SDK normally handles this, but its
    // redirect mode (used on mobile/PWA when popups are blocked) also
    // results in a generic dialog.
    //
    // Solution: use window.open() to launch the OAuth URL with
    // display=popup + config_id. On mobile, this opens a new tab in the
    // system browser where the Embedded Signup UI renders correctly.
    // Facebook redirects the new tab to our callback, which processes the
    // code and redirects to /settings?wa=connected.
    // ──────────────────────────────────────────────────────────────────────

    var PROD_URL = 'https://nyasadesk1.vercel.app';
    var workspaceId = new URLSearchParams(window.location.search).get('workspace_id');
    var statusEl  = document.getElementById('status');
    var titleEl   = document.getElementById('title');
    var spinnerEl = document.getElementById('spinner');
    var manualEl  = document.getElementById('manual');
    var openFbBtn = document.getElementById('openFb');
    var backBtn   = document.getElementById('backBtn');

    backBtn.addEventListener('click', function() {
      window.location.href = '/settings?tab=channels';
    });

    function showError(msg) {
      titleEl.textContent = 'Connection failed';
      titleEl.classList.add('error');
      statusEl.textContent = msg;
      spinnerEl.classList.add('hidden');
      manualEl.classList.remove('hidden');
      openFbBtn.classList.add('hidden');
    }

    function redirectToSettings(extra) {
      window.location.href = '/settings?tab=channels' + (extra || '');
    }

    // Check if returning from Facebook redirect (code in URL)
    var params = new URLSearchParams(window.location.search);
    if (params.get('code') && params.get('state')) {
      // We're the redirect_uri target — send code to backend
      titleEl.textContent = 'Completing connection';
      statusEl.textContent = 'Registering your WhatsApp number with WasapFlow…';
      fetch('/api/auth/whatsapp-embedded', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          code: params.get('code'),
          workspace_id: params.get('state'),
          provider: 'wasapflow'
        })
      })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.ok) {
          titleEl.textContent = 'WhatsApp connected!';
          statusEl.textContent = 'Redirecting to Settings…';
          setTimeout(function() { redirectToSettings('&wa=connected'); }, 1500);
        } else {
          redirectToSettings('&wa_error=' + encodeURIComponent(d.error || 'Registration failed'));
        }
      })
      .catch(function(e) {
        redirectToSettings('&wa_error=' + encodeURIComponent(e.message));
      });
    } else if (!workspaceId) {
      showError('Missing workspace ID. Go back to Settings and try again.');
    } else {
      // Fetch signup config and launch the popup
      fetch('/api/channels?action=signup-config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}'
      })
      .then(function(r) { return r.json(); })
      .then(function(cfg) {
        if (!cfg.ok || !cfg.app_id || !cfg.config_id) {
          throw new Error(cfg.error || 'Could not load WhatsApp signup config');
        }

        // Build the Facebook OAuth URL with config_id + display=popup
        // display=popup is critical — it tells Facebook to render the
        // Embedded Signup UI instead of a generic login dialog
        var redirectUri = encodeURIComponent(PROD_URL + '/wa-connect.html');
        var oauthUrl = 'https://www.facebook.com/v19.0/dialog/oauth'
          + '?client_id=' + cfg.app_id
          + '&redirect_uri=' + redirectUri
          + '&state=' + workspaceId
          + '&scope=whatsapp_business_management,whatsapp_business_messaging'
          + '&response_type=code'
          + '&config_id=' + cfg.config_id
          + '&display=popup';

        function openPopup() {
          var popup = window.open(oauthUrl, 'whatsapp_signup', 'width=600,height=700,scrollbars=yes');

          if (!popup || popup.closed || typeof popup.closed === 'undefined') {
            // Popup was blocked — show manual button
            titleEl.textContent = 'Connect WhatsApp Business';
            statusEl.textContent = 'Tap the button below to open Facebook in a new tab.';
            spinnerEl.classList.add('hidden');
            manualEl.classList.remove('hidden');
            return false;
          }
          return true;
        }

        // Try to auto-open the popup
        titleEl.textContent = 'Opening Facebook…';
        statusEl.textContent = 'A new tab will open for you to complete the signup.';

        // Small delay to ensure the page is fully rendered
        setTimeout(function() {
          var opened = openPopup();
          if (opened) {
            // Popup opened — show waiting state
            spinnerEl.classList.add('hidden');
            manualEl.classList.remove('hidden');
            openFbBtn.textContent = 'Reopen Facebook Tab';
            titleEl.textContent = 'Waiting for signup';
            statusEl.textContent = 'Complete the signup in the other tab, then come back here.';

            // Poll for the popup closing (user completed or cancelled)
            // We can't read the popup's URL due to cross-origin, but we
            // can detect when it closes and then check if the connection
            // was successful by polling our backend
            var pollInterval = setInterval(function() {
              // Check if the popup was redirected to our callback
              // (cross-origin restriction means we can't read the URL,
              // but we can detect when the popup navigates to our domain)
              try {
                if (popup && popup.location && popup.location.hostname === 'nyasadesk1.vercel.app') {
                  // Popup is now on our domain — the callback is processing
                  clearInterval(pollInterval);
                  titleEl.textContent = 'Completing connection…';
                  statusEl.textContent = 'Processing your WhatsApp registration…';
                  // The popup will redirect to /settings?wa=connected on its own
                  // Just redirect this page too
                  setTimeout(function() {
                    redirectToSettings('&wa=connected');
                  }, 2000);
                }
              } catch(e) {
                // Cross-origin error — popup is still on Facebook, keep waiting
              }

              // Also check if popup was closed (user cancelled)
              if (!popup || popup.closed) {
                clearInterval(pollInterval);
                // Don't immediately show error — the popup might have closed
                // because Facebook redirected it to our domain and the browser
                // closed the popup. Give it a moment then check.
                setTimeout(function() {
                  // If we're still here after 3s, the user likely cancelled
                  if (document.visibilityState === 'visible') {
                    titleEl.textContent = 'Connection cancelled?';
                    statusEl.textContent = 'If you closed the Facebook tab before completing signup, tap below to try again.';
                    openFbBtn.textContent = 'Try Again';
                  }
                }, 3000);
              }
            }, 1000);
          }
        }, 500);

        // Manual button handler
        openFbBtn.addEventListener('click', function() {
          openPopup();
        });
      })
      .catch(function(e) {
        showError(e.message || 'Failed to initialize WhatsApp connection');
      });
    }
  </script>
</body>
</html>
