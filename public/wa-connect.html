<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connecting WhatsApp · Nyasadesk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0B141A;
      color: #e9edef;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: #202C33;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .logo {
      width: 56px; height: 56px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #075E54, #128C7E);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 800; color: white;
    }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    p  { font-size: 14px; color: #8696a0; line-height: 1.5; }
    .spinner {
      width: 28px; height: 28px;
      border: 3px solid #2a3942;
      border-top-color: #25D366;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #ff6b6b; }
    .success { color: #25D366; }
    .hidden { display: none; }
    .btn {
      display: block;
      margin-top: 20px;
      padding: 14px 32px;
      background: #25D366;
      color: #0B141A;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      border: none;
      cursor: pointer;
      width: 100%;
      text-align: center;
    }
    .btn.secondary {
      background: #2a3942;
      color: #e9edef;
      margin-top: 12px;
    }
    .pwa-notice {
      margin-top: 20px;
      padding: 16px;
      background: #2a3942;
      border-radius: 10px;
      text-align: left;
    }
    .pwa-notice p { color: #e9edef; font-size: 13px; margin-bottom: 8px; }
    .pwa-notice p:last-child { margin-bottom: 0; }
    .pwa-notice strong { color: #25D366; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">N</div>
    <h1 id="title">Connect WhatsApp Business</h1>
    <p id="status">Opening WasapFlow's secure signup page…</p>
    <div id="spinner" class="spinner"></div>
    <div id="actions" class="hidden"></div>
  </div>

  <script>
    // ──────────────────────────────────────────────────────────────────────
    // WhatsApp Embedded Signup — using WasapFlow's hosted connect page
    //
    // The Embedded Signup UI only renders when FB.login() runs on a domain
    // that's in WasapFlow's Meta app's "Allowed Domains" list. Our domain
    // (nyasadesk1.vercel.app) is NOT in that list, so FB.login() on our
    // domain shows a generic OAuth dialog instead of the WhatsApp-specific
    // signup flow.
    //
    // WasapFlow's hosted connect page (partner.wasapflow.com/bridge/connect)
    // IS on their whitelisted domain. It loads the FB SDK, calls FB.login()
    // with config_id + extras, and posts the result back via
    // window.opener.postMessage(). We just open it as a popup and listen
    // for the WASAPFLOW_CONNECT_SUCCESS message.
    // ──────────────────────────────────────────────────────────────────────

    var workspaceId = new URLSearchParams(window.location.search).get('workspace_id');
    var statusEl  = document.getElementById('status');
    var titleEl   = document.getElementById('title');
    var spinnerEl = document.getElementById('spinner');
    var actionsEl = document.getElementById('actions');

    function isStandalonePWA() {
      return window.matchMedia('(display-mode: standalone)').matches
        || window.navigator.standalone === true;
    }

    function redirectToSettings(extra) {
      window.location.href = '/settings?tab=channels' + (extra || '');
    }

    // ── Listen for the success message from WasapFlow's hosted page ──────
    window.addEventListener('message', function(event) {
      // WasapFlow's hosted page posts with '*' as target origin
      if (!event.data || typeof event.data !== 'object') return;

      if (event.data.type === 'WASAPFLOW_CONNECT_SUCCESS') {
        titleEl.textContent = 'WhatsApp connected!';
        titleEl.classList.add('success');
        statusEl.textContent = 'Saving your WhatsApp configuration…';
        spinnerEl.classList.remove('hidden');
        actionsEl.classList.add('hidden');

        // Save the WABA config to our database
        fetch('/api/channels?action=save-waba', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            workspace_id: workspaceId,
            waba_id: event.data.waba_id,
            phone_number_id: event.data.phone_number_id,
            display_name: event.data.display_name,
            quality_rating: event.data.quality_rating,
            connection_mode: event.data.connection_mode
          })
        })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.ok) {
            statusEl.textContent = 'Redirecting to Settings…';
            setTimeout(function() { redirectToSettings('&wa=connected'); }, 1500);
          } else {
            redirectToSettings('&wa_error=' + encodeURIComponent(d.error || 'Failed to save WhatsApp config'));
          }
        })
        .catch(function(e) {
          redirectToSettings('&wa_error=' + encodeURIComponent(e.message));
        });
      }
    });

    if (!workspaceId) {
      titleEl.textContent = 'Error';
      titleEl.classList.add('error');
      statusEl.textContent = 'Missing workspace ID. Go back to Settings and try again.';
      spinnerEl.classList.add('hidden');
      actionsEl.innerHTML = '<a class="btn" href="/settings?tab=channels">Back to Settings</a>';
      actionsEl.classList.remove('hidden');
    } else {
      // ── Open WasapFlow's hosted connect page as a popup ───────────────
      // The hosted page is on partner.wasapflow.com (whitelisted with Meta).
      // It handles the FB SDK, FB.login(), Embedded Signup UI, and WABA
      // registration. It posts the result back to us via postMessage.

      var hostedUrl = '/api/channels?action=hosted-connect&workspace_id=' + workspaceId;

      function openHostedPopup() {
        var popup = window.open(hostedUrl, 'wasapflow_connect', 'width=500,height=700,scrollbars=yes');

        if (!popup || popup.closed || typeof popup.closed === 'undefined') {
          // Popup blocked — show manual options
          titleEl.textContent = 'Popup blocked';
          statusEl.textContent = 'Tap the button below to open the signup page in a new tab.';
          spinnerEl.classList.add('hidden');
          actionsEl.innerHTML = '';

          // Direct link to the hosted page (opens in new tab)
          var openLink = document.createElement('a');
          openLink.className = 'btn';
          openLink.href = hostedUrl;
          openLink.target = '_blank';
          openLink.rel = 'noopener';
          openLink.textContent = 'Open Signup Page';
          actionsEl.appendChild(openLink);

          // Back to settings
          var backLink = document.createElement('a');
          backLink.className = 'btn secondary';
          backLink.href = '/settings?tab=channels';
          backLink.textContent = 'Back to Settings';
          actionsEl.appendChild(backLink);

          actionsEl.classList.remove('hidden');
          return false;
        }
        return true;
      }

      // Try to auto-open the popup
      var opened = openHostedPopup();

      if (opened) {
        titleEl.textContent = 'Waiting for signup';
        statusEl.textContent = 'Complete the WhatsApp signup in the popup window. This page will update automatically when done.';

        // Check if popup was closed (user cancelled or completed)
        var checkInterval = setInterval(function() {
          // The postMessage listener will handle success.
          // Here we just detect if the popup was closed without success.
          // We can't read popup.location due to cross-origin.
          // But we can detect popup.closed.
          // Note: after postMessage success, we redirect, so this interval
          // is cleared by the page unload.
        }, 1000);

        // After 60 seconds with no response, show a "still waiting?" message
        setTimeout(function() {
          if (document.visibilityState === 'visible') {
            statusEl.textContent = 'Still waiting? If the popup didn\'t open, tap below to try again.';
            actionsEl.innerHTML = '';
            var retry = document.createElement('button');
            retry.className = 'btn';
            retry.textContent = 'Reopen Popup';
            retry.onclick = function() { openHostedPopup(); };
            actionsEl.appendChild(retry);
            var back = document.createElement('a');
            back.className = 'btn secondary';
            back.href = '/settings?tab=channels';
            back.textContent = 'Back to Settings';
            actionsEl.appendChild(back);
            actionsEl.classList.remove('hidden');
          }
        }, 60000);
      }
    }
  </script>
</body>
</html>
